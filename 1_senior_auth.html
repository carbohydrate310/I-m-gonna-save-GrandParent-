<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かぞくボイス - はじめる</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-800 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="w-full max-w-md h-[840px] bg-gradient-to-b from-stone-50 via-emerald-50/40 to-stone-100 rounded-[40px] border-[8px] border-slate-900 shadow-2xl overflow-hidden flex flex-col justify-between p-6">
    
    <!-- ヘッダーエリア -->
    <div class="pt-4 text-center">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-600 text-white rounded-3xl shadow-lg shadow-emerald-200 mb-3">
        <i class="fa-solid fa-microphone-lines text-4xl"></i>
      </div>
      <h1 class="text-3xl font-black text-slate-800 tracking-wide">かぞくボイス</h1>
      <p class="text-slate-600 text-lg font-bold mt-1">声でつながる、家族のばしょ</p>
    </div>

    <!-- フォーム領域 -->
    <div class="bg-white/95 border-2 border-emerald-100 rounded-3xl p-6 shadow-xl space-y-5">
      
      <!-- 切り替えタブ -->
      <div class="grid grid-cols-2 bg-slate-100 p-1.5 rounded-2xl text-center font-black text-lg">
        <button class="bg-emerald-600 text-white py-3 rounded-xl shadow-md">はじめて（登録）</button>
        <button class="text-slate-500 py-3 rounded-xl hover:text-slate-800">つかったことがある</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-slate-800 text-lg font-black mb-1">
            <i class="fa-solid fa-phone text-emerald-600 mr-2"></i>電話番号
          </label>
          <input type="tel" placeholder="09012345678" class="w-full text-2xl font-black p-4 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:border-emerald-600 focus:bg-white outline-none transition-all placeholder:text-slate-300 text-slate-800">
          <p class="text-xs text-slate-500 mt-1 font-bold">※ 数字を入力するとショートメッセージ（SMS）が届きます</p>
        </div>

        <div>
          <label class="block text-slate-800 text-lg font-black mb-1">
            <i class="fa-solid fa-user text-emerald-600 mr-2"></i>お名前（家族に見せる名前）
          </label>
          <input type="text" placeholder="例：おじいちゃん" class="w-full text-xl font-bold p-4 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:border-emerald-600 focus:bg-white outline-none transition-all placeholder:text-slate-300 text-slate-800">
        </div>
      </div>

      <!-- ①から③へ無条件で進むリンクボタン -->
      <a href="3_senior_chat.html" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white text-2xl font-black py-5 rounded-2xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-3">
        <span>つぎへ進む</span>
        <i class="fa-solid fa-circle-arrow-right text-3xl"></i>
      </a>

    </div>

    <!-- 簡単登録・サポート -->
    <div class="text-center space-y-3 pb-2">
      <a href="3_senior_chat.html" class="w-full bg-white border-2 border-slate-200 text-slate-700 hover:bg-slate-50 text-lg font-bold py-3.5 rounded-2xl flex items-center justify-center gap-3 shadow-sm">
        <i class="fa-comment text-emerald-500 text-2xl"></i>
        <span>LINEで かんたん登録</span>
      </a>
      <p class="text-xs font-bold text-slate-500">
        使い方が分からないときは：<a href="#" class="text-emerald-700 underline font-black">ご家族にきく</a>
      </p>
    </div>

  </div>

</body>
</html>
