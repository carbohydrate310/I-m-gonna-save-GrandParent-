<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かぞくボイス - チャット</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-800 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="w-full max-w-md h-[840px] bg-stone-100 rounded-[40px] border-[8px] border-slate-900 shadow-2xl overflow-hidden flex flex-col justify-between relative">
    
    <!-- ヘッダー -->
    <header class="bg-white border-b-2 border-stone-200 px-4 py-3 flex items-center justify-between shadow-sm z-10">
      <div class="flex items-center gap-3">
        <a href="1_senior_auth.html" class="text-slate-400 hover:text-slate-600 pr-1">
          <i class="fa-solid fa-chevron-left text-xl"></i>
        </a>
        <div class="relative">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&auto=format&fit=crop&q=80" class="w-12 h-12 rounded-full object-cover border-2 border-emerald-500">
          <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
        <div>
          <h2 class="text-xl font-black text-slate-800">はなこ（娘）</h2>
          <p class="text-xs font-bold text-emerald-700">● 10分まえに見ました</p>
        </div>
      </div>
      <button class="bg-emerald-50 border-2 border-emerald-300 text-emerald-800 px-3 py-2 rounded-2xl hover:bg-emerald-100 flex items-center gap-1.5 font-black text-sm">
        <i class="fa-solid fa-phone text-emerald-600 text-lg"></i>
        <span>でんわ</span>
      </button>
    </header>

    <!-- タイムライン -->
    <div class="flex-1 overflow-y-auto p-4 space-y-5 bg-gradient-to-b from-stone-100 to-emerald-50/30">
      
      <div class="text-center">
        <span class="bg-white/90 border border-stone-200 text-stone-600 text-xs font-bold px-3 py-1 rounded-full shadow-sm">
          きょう 8月17日(月)
        </span>
      </div>

      <!-- 受信：娘 -->
      <div class="flex items-start gap-2.5">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-full object-cover mt-1 border border-stone-200">
        <div class="space-y-1 max-w-[80%]">
          <span class="text-xs font-bold text-slate-500 ml-1">はなこ 10:15</span>
          <div class="bg-white border-2 border-slate-200 p-4 rounded-3xl rounded-tl-none shadow-sm text-slate-800 text-lg font-bold">
            お父さん、おはよう！今朝のお薬は飲んだかな？夕方顔を出すね！
          </div>
        </div>
      </div>

      <!-- 送信：自分（ボイス） -->
      <div class="flex items-start justify-end gap-2.5">
        <div class="space-y-1 max-w-[85%] text-right">
          <span class="text-xs font-bold text-emerald-700 mr-1">あなた（声メッセージ）10:20</span>
          <div class="bg-emerald-600 text-white p-4 rounded-3xl rounded-tr-none shadow-md space-y-2">
            <div class="flex items-center gap-3">
              <button class="w-12 h-12 bg-white text-emerald-700 rounded-full flex items-center justify-center text-xl shadow hover:scale-105 active:scale-95 transition-transform">
                <i class="fa-solid fa-play ml-1"></i>
              </button>
              <div class="flex-1 text-left">
                <div class="flex items-center gap-1 h-6">
                  <span class="w-1 h-3 bg-emerald-200 rounded-full"></span>
                  <span class="w-1 h-5 bg-white rounded-full"></span>
                  <span class="w-1 h-2 bg-emerald-200 rounded-full"></span>
                  <span class="w-1 h-6 bg-white rounded-full"></span>
                  <span class="w-1 h-4 bg-white rounded-full"></span>
                  <span class="w-1 h-2 bg-emerald-200 rounded-full"></span>
                  <span class="w-1 h-5 bg-white rounded-full"></span>
                </div>
                <span class="text-xs font-bold text-emerald-100">0:12（押して聴く）</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 受信：娘（スタンプ） -->
      <div class="flex items-start gap-2.5">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-full object-cover mt-1 border border-stone-200">
        <div class="space-y-1">
          <span class="text-xs font-bold text-slate-500 ml-1">はなこ 10:22</span>
          <div class="bg-amber-100 border-2 border-amber-300 p-3 rounded-3xl rounded-tl-none shadow-sm flex items-center gap-2">
            <span class="text-4xl">👍</span>
            <span class="text-lg font-black text-amber-900">りょうかい！</span>
          </div>
        </div>
      </div>

      <!-- 送信：自分（写真） -->
      <div class="flex items-start justify-end gap-2.5">
        <div class="space-y-1 max-w-[75%] text-right">
          <span class="text-xs font-bold text-emerald-700 mr-1">あなた（写真）10:25</span>
          <div class="bg-emerald-600 p-2 rounded-3xl rounded-tr-none shadow-md inline-block">
            <img src="https://images.unsplash.com/photo-1516253593875-bd7ba052fbc5?w=400&auto=format&fit=crop&q=80" class="rounded-2xl w-full h-36 object-cover">
            <p class="text-white font-bold text-sm text-center pt-1.5 pb-0.5">朝のお散歩のしゃしん</p>
          </div>
        </div>
      </div>

    </div>

    <!-- シニア向け操作パネル -->
    <div class="bg-white border-t-2 border-stone-300 p-4 shadow-xl space-y-3 z-10">
      
      <!-- サブボタンエリア -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="alert('カメラや写真フォルダが開きます')" class="bg-sky-50 hover:bg-sky-100 border-2 border-sky-300 text-sky-900 font-black py-3 rounded-2xl flex items-center justify-center gap-2 shadow-sm text-lg active:scale-95 transition-all">
          <i class="fa-solid fa-camera text-sky-600 text-2xl"></i>
          <span>しゃしん</span>
        </button>
        
        <button onclick="toggleStampPanel()" class="bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 text-amber-900 font-black py-3 rounded-2xl flex items-center justify-center gap-2 shadow-sm text-lg active:scale-95 transition-all">
          <i class="fa-solid fa-face-smile text-amber-600 text-2xl"></i>
          <span>スタンプ</span>
        </button>
      </div>

      <!-- スタンプ選択枠（アコーディオン） -->
      <div id="stamp-panel" class="hidden bg-stone-50 border-2 border-amber-300 rounded-2xl p-3 grid grid-cols-3 gap-2">
        <button onclick="toggleStampPanel()" class="bg-white border border-amber-300 p-2 rounded-xl text-center hover:bg-amber-50 shadow-sm font-bold text-sm">
          <div class="text-3xl">🌸</div>ありがとう
        </button>
        <button onclick="toggleStampPanel()" class="bg-white border border-amber-300 p-2 rounded-xl text-center hover:bg-amber-50 shadow-sm font-bold text-sm">
          <div class="text-3xl">👌</div>わかったよ
        </button>
        <button onclick="toggleStampPanel()" class="bg-white border border-amber-300 p-2 rounded-xl text-center hover:bg-amber-50 shadow-sm font-bold text-sm">
          <div class="text-3xl">🍚</div>ごはん食べた
        </button>
      </div>

      <!-- 超巨大録音ボタン -->
      <div class="pt-1">
        <button id="record-btn" onclick="handleRecordClick()" class="w-full bg-red-500 hover:bg-red-600 active:bg-red-700 text-white py-4.5 rounded-2xl font-black text-2xl shadow-xl shadow-red-200 flex items-center justify-center gap-3 border-4 border-red-200 transition-all">
          <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-red-500 shadow-sm">
            <i class="fa-solid fa-microphone text-xl"></i>
          </div>
          <span id="record-btn-text">押して「こえ」をはなす</span>
        </button>
      </div>

    </div>

  </div>

  <script>
    function toggleStampPanel() {
      const panel = document.getElementById('stamp-panel');
      panel.classList.toggle('hidden');
    }

    let isRecording = false;
    function handleRecordClick() {
      const btn = document.getElementById('record-btn');
      const txt = document.getElementById('record-btn-text');
      
      if (!isRecording) {
        btn.classList.remove('bg-red-500', 'hover:bg-red-600');
        btn.classList.add('bg-emerald-600', 'animate-pulse');
        txt.innerText = '● はなしています（もう1度おすと送信）';
        isRecording = true;
      } else {
        btn.classList.remove('bg-emerald-600', 'animate-pulse');
        btn.classList.add('bg-red-500', 'hover:bg-red-600');
        txt.innerText = '押して「こえ」をはなす';
        isRecording = false;
        alert('声メッセージを家族に送りました！');
      }
    }
  </script>

</body>
</html>
