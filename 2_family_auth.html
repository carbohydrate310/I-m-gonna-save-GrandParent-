<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かぞくボイス for Family - 登録</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-800 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="w-full max-w-md h-[840px] bg-slate-50 rounded-[40px] border-[8px] border-slate-900 shadow-2xl overflow-hidden flex flex-col justify-between p-6">
    
    <div class="pt-6 text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 text-white rounded-2xl shadow-md mb-1">
        <i class="fa-solid fa-microphone-lines text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">かぞくボイス for Family</h1>
      <p class="text-slate-500 text-xs font-medium">ご家族用 見守り・チャットアカウント</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-5">
      <div class="flex border-b border-slate-200 text-sm font-medium">
        <button class="flex-1 py-2.5 text-indigo-600 border-b-2 border-indigo-600 font-bold">新規アカウント作成</button>
        <button class="flex-1 py-2.5 text-slate-400 hover:text-slate-600">ログイン</button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-700 font-medium mb-1">メールアドレス</label>
          <input type="email" placeholder="example@email.com" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:border-indigo-600 focus:bg-white outline-none">
        </div>
        <div>
          <label class="block text-slate-700 font-medium mb-1">パスワード</label>
          <input type="password" placeholder="8文字以上" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:border-indigo-600 focus:bg-white outline-none">
        </div>
        <div>
          <label class="block text-slate-700 font-medium mb-1">招待コード（シニア側から共有されたコード）</label>
          <input type="text" value="KAZOKU-8823" class="w-full p-3 bg-indigo-50/50 border border-indigo-200 rounded-xl focus:border-indigo-600 outline-none font-mono font-bold text-indigo-900">
        </div>
      </div>

      <!-- ②から④へ無条件で進むリンクボタン -->
      <a href="4_family_chat.html" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-indigo-100 transition-all text-base flex items-center justify-center gap-2">
        <span>家族グループに参加して始める</span>
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </a>
    </div>

    <div class="space-y-3 text-center text-xs text-slate-500 pb-2">
      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-4 text-slate-400">または</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <a href="4_family_chat.html" class="bg-white border border-slate-200 p-2.5 rounded-xl font-medium text-slate-700 flex items-center justify-center gap-2">
          <i class="fa-brands fa-google text-red-500 text-lg"></i> Google
        </a>
        <a href="4_family_chat.html" class="bg-white border border-slate-200 p-2.5 rounded-xl font-medium text-slate-700 flex items-center justify-center gap-2">
          <i class="fa-brands fa-apple text-slate-900 text-lg"></i> Apple
        </a>
      </div>
    </div>

  </div>

</body>
</html>
